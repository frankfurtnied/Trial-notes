<script>
  /* Deployment/cache guard.
     Safari/iOS can retain an older service-worker app shell even after the
     HTML on GitHub Pages has changed. On a new build, clear only this
     origin's Cache Storage and service workers, then reload once. */
  const TRAIL_NOTES_BUILD = '2026-09-28-reservations-v2';
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    (async function ensureFreshTrailNotesBuild(){
      try {
        const seen = localStorage.getItem('trailNotesBuild');
        if (seen !== TRAIL_NOTES_BUILD) {
          localStorage.setItem('trailNotesBuild', TRAIL_NOTES_BUILD);
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          const u = new URL(location.href);
          u.searchParams.set('tnb', TRAIL_NOTES_BUILD);
          location.replace(u.toString());
        }
      } catch (err) {
        console.warn('Trail Notes cache refresh could not complete:', err);
      }
    })();
  }
</script>

<title>Trail Notes — Camping Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bark:#2C1A0E;--moss:#3D5A2A;--pine:#1E3A1F;--soil:#6B4226;
  --amber:#C8872A;--cream:#F5EDD8;--parchment:#EDE0C4;
  --fog:#7a6a5a;--smoke:#b5a898;--ember:#E07030;
  --font-heading:'Playfair Display',Georgia,serif;
  --font-body:'Lato',system-ui,-apple-system,sans-serif;
  --font-serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background-color:var(--pine);
  background-image:radial-gradient(ellipse at 20% 20%,rgba(61,90,42,.6) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 80%,rgba(44,26,14,.8) 0%,transparent 60%);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  color:var(--bark);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:980px;margin:0 auto;padding:36px 18px 80px;}

/* ── HEADER ── */
header{text-align:center;margin-bottom:32px;animation:fadeDown .8s ease both;}
.logo-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px;}
header h1{
  font-family:var(--font-heading);
  font-size:clamp(2rem,5.5vw,3.4rem);
  font-weight:700;
  color:var(--cream);
  letter-spacing:.02em;
  line-height:1.1;
}
header h1 em{font-style:italic;color:var(--amber);}
header p{
  color:var(--smoke);
  font-family:var(--font-body);
  font-size:.78rem;
  font-weight:300;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-top:6px;
}
.divider{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent);margin:14px auto 0;}
.welcome-msg{
  font-family:var(--font-heading);
  font-style:italic;
  font-size:1.05rem;
  color:var(--cream);
  margin-top:14px;
  opacity:.92;
}

/* ── STATS BAR ── */
.stats-bar{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:28px;}
.stat{
  background:rgba(245,237,216,.1);
  border:1px solid rgba(245,237,216,.14);
  border-radius:12px;
  padding:22px 16px 20px;
  text-align:center;
  transition:transform .15s, background .2s, box-shadow .2s;
  position:relative;
  overflow:hidden;
}
.stat::before{content:'';position:absolute;bottom:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,rgba(200,135,42,.35),transparent);border-radius:2px;}
.stat:hover{background:rgba(245,237,216,.16);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.22);}
.stat-icon{
  font-size:1.8rem;
  line-height:1;
  margin-bottom:10px;
}
.stat-num{
  font-family:var(--font-heading);
  font-size:2.4rem;
  font-weight:700;
  color:var(--amber);
  line-height:1;
  letter-spacing:-.02em;
}
.stat-label{
  font-family:var(--font-body);
  font-size:.6rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.15em;
  color:var(--smoke);
  margin-top:7px;
}
.stat-sub{
  font-family:var(--font-body);
  font-size:.74rem;
  color:var(--smoke);
  line-height:1.3;
}

/* ── TABS ── */
.tabs{display:flex;gap:4px;margin-bottom:22px;}
.tab{
  flex:1;
  padding:11px 14px;
  text-align:center;
  font-family:var(--font-body);
  font-size:.82rem;
  font-weight:400;
  letter-spacing:.04em;
  background:rgba(245,237,216,.07);
  border:1px solid rgba(245,237,216,.13);
  color:var(--smoke);
  border-radius:5px;
  cursor:pointer;
  transition:all .2s;
}
.tab:hover{background:rgba(245,237,216,.13);color:var(--cream);}
.tab.active{
  background:var(--parchment);
  color:var(--bark);
  border-color:var(--parchment);
  font-weight:700;
  letter-spacing:.02em;
}
.panel{display:none;}.panel.active{display:block;}
.top-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:stretch;width:100%;box-sizing:border-box;overflow:hidden;}
.top-bar input{flex:1 1 280px;min-width:220px;max-width:100%;box-sizing:border-box;background:rgba(245,237,216,.1);border:1px solid rgba(245,237,216,.2);border-radius:4px;padding:10px 14px;font-family:-apple-system,Georgia,serif;font-size:.98rem;color:var(--cream);outline:none;}
.top-bar input::placeholder{color:var(--fog);}
.top-bar input:focus{border-color:var(--amber);}
.btn-amber{background:linear-gradient(135deg,var(--amber),var(--ember));color:white;border:none;border-radius:4px;padding:0 18px;font-family:-apple-system,Georgia,serif;font-size:.9rem;cursor:pointer;transition:all .2s;box-shadow:0 2px 10px rgba(200,135,42,.35);white-space:nowrap;}
.btn-amber:hover{transform:translateY(-1px);}
.park-card{background:var(--parchment);border-radius:4px;margin-bottom:9px;box-shadow:0 3px 16px rgba(0,0,0,.27);overflow:hidden;transition:box-shadow .2s;}
.park-card:hover{box-shadow:0 5px 24px rgba(0,0,0,.38);}
.park-header{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;cursor:pointer;user-select:none;border-left:5px solid var(--moss);}
.park-header.been{border-left-color:var(--amber);}
.park-header.custom-h{border-left-color:var(--ember);}
.park-name{
  font-family:var(--font-heading);
  font-size:1.05rem;
  font-weight:600;
  color:var(--bark);
  letter-spacing:.01em;
}
.park-sub{
  font-family:var(--font-body);
  font-size:.76rem;
  color:var(--fog);
  margin-top:3px;
  letter-spacing:.02em;
}
.park-right{display:flex;gap:5px;align-items:center;flex-shrink:0;}
.badge{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:12px;}
.bv{background:var(--amber);color:white;}.bn{background:var(--moss);color:var(--cream);}.bc{background:var(--ember);color:white;}
.chevron{color:var(--fog);font-size:.78rem;margin-left:4px;transition:transform .2s;display:inline-block;}
.park-card.open .chevron{transform:rotate(180deg);}
.park-body{display:none;padding:0 17px 16px;border-top:1px solid var(--fog);}
.park-card.open .park-body{display:block;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
@media(max-width:560px){.info-grid{grid-template-columns:1fr;}}
.info-block label{display:block;font-family:var(--font-body);font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--fog);margin-bottom:3px;}
.info-block p{font-family:var(--font-body);font-size:.9rem;color:var(--bark);line-height:1.65;}
.trip-log{margin-top:14px;border-top:1px solid var(--fog);padding-top:12px;}
.trip-log-title{font-family:var(--font-heading);font-size:.95rem;font-weight:600;color:var(--bark);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.01em;}
.trip-count-badge{background:var(--amber);color:white;font-size:.65rem;padding:2px 8px;border-radius:12px;font-family:Arial,sans-serif;}
.trip-entries{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.trip-entry{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.35);border:1px solid var(--fog);border-radius:3px;padding:7px 10px;font-size:.87rem;color:var(--bark);}
.trip-date-badge{
  font-family:var(--font-body);
  font-weight:700;
  color:var(--amber);
  font-size:.8rem;
  letter-spacing:.02em;
  white-space:nowrap;
  flex-shrink:0;
}
.trip-site{
  font-family:var(--font-body);
  font-weight:700;
  color:var(--moss);
  font-size:.8rem;
  white-space:nowrap;
  flex-shrink:0;
}
.trip-note{
  flex:1;
  font-family:var(--font-body);
  color:var(--soil);
  font-size:.8rem;
  font-style:italic;
  line-height:1.5;
}
.btn-del-trip{background:none;border:none;color:var(--fog);cursor:pointer;font-size:.85rem;padding:0 2px;transition:color .2s;flex-shrink:0;}
.btn-del-trip:hover{color:#c0392b;}
.add-trip-row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;background:rgba(255,255,255,.2);border:1px dashed var(--fog);border-radius:4px;padding:10px;}
.add-trip-row .field{display:flex;flex-direction:column;gap:3px;}
.add-trip-row label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fog);}
.add-trip-row input{background:rgba(255,255,255,.6);border:1px solid var(--fog);border-radius:3px;padding:6px 9px;font-family:-apple-system,Georgia,serif;font-size:16px;color:var(--bark);outline:none;}
.add-trip-row input:focus{border-color:var(--amber);}
.add-trip-row input[type="date"]{width:155px;}
.add-trip-row input[type="text"].site-in{width:80px;}
.add-trip-row input[type="text"].note-in{flex:1;min-width:120px;}
.btn-add-trip{background:var(--moss);color:var(--cream);border:none;border-radius:3px;padding:7px 16px;font-family:-apple-system,Georgia,serif;font-size:.88rem;cursor:pointer;transition:all .2s;white-space:nowrap;align-self:flex-end;}
.btn-add-trip:hover{background:var(--pine);}
.park-actions{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;}
.btn-g{background:linear-gradient(135deg,var(--moss),var(--pine));color:var(--cream);border:none;border-radius:3px;padding:6px 14px;font-family:-apple-system,Georgia,serif;font-size:.82rem;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.btn-g:hover{transform:translateY(-1px);}
.btn-o{background:none;border:1px solid var(--fog);color:var(--fog);border-radius:3px;padding:6px 14px;font-family:-apple-system,Georgia,serif;font-size:.82rem;cursor:pointer;transition:all .2s;}
.btn-o:hover{border-color:var(--amber);color:var(--bark);}
.btn-o.danger:hover{border-color:#c0392b;color:#c0392b;}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal-bg.hidden{display:none;}
.modal{background:var(--parchment);border-radius:6px;padding:26px 28px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;}
.modal-title{font-family:var(--font-heading);font-size:1.3rem;font-weight:600;color:var(--bark);margin-bottom:18px;letter-spacing:.01em;}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.3rem;color:var(--fog);cursor:pointer;}
.modal-close:hover{color:var(--bark);}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
@media(max-width:560px){.fg2{grid-template-columns:1fr;}}
.fl{margin-bottom:10px;}
label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--fog);margin-bottom:3px;}
input[type="text"],input[type="date"],textarea,select{width:100%;background:rgba(255,255,255,.5);border:1px solid var(--fog);border-radius:3px;padding:8px 11px;font-family:-apple-system,Georgia,serif;font-size:16px;color:var(--bark);outline:none;transition:border-color .2s,box-shadow .2s;}
input:focus,textarea:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(200,135,42,.15);}
textarea{resize:vertical;min-height:76px;line-height:1.6;}
.btn-save{background:linear-gradient(135deg,var(--moss),var(--pine));color:var(--cream);border:none;border-radius:3px;padding:9px 22px;font-family:-apple-system,Georgia,serif;font-size:.9rem;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.btn-save:hover{transform:translateY(-1px);}
.btn-cancel{background:none;border:1px solid var(--fog);color:var(--fog);border-radius:3px;padding:9px 18px;font-family:-apple-system,Georgia,serif;font-size:.9rem;cursor:pointer;transition:all .2s;margin-left:7px;}
.btn-cancel:hover{border-color:var(--ember);color:var(--ember);}
/* JOURNAL */
.entry-form{background:var(--parchment);border-radius:4px;padding:24px 26px;margin-bottom:24px;box-shadow:0 8px 36px rgba(0,0,0,.38);position:relative;}
.entry-form::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--amber),var(--ember));border-radius:4px 0 0 4px;}
.mood-row,.weather-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;}
.mood-btn{background:rgba(255,255,255,.4);border:1px solid var(--fog);border-radius:20px;padding:4px 12px;font-family:-apple-system,Georgia,serif;font-size:.88rem;color:var(--fog);cursor:pointer;transition:all .2s;}
.mood-btn:hover{border-color:var(--amber);color:var(--bark);}
.mood-btn.active{background:var(--amber);border-color:var(--amber);color:white;}
.weather-btn{background:rgba(255,255,255,.4);border:1px solid var(--fog);border-radius:6px;padding:5px 9px;font-size:1.05rem;cursor:pointer;transition:all .2s;line-height:1;}
.weather-btn:hover{transform:scale(1.15);}
.weather-btn.active{background:var(--amber);border-color:var(--amber);}
.big-save{margin-top:12px;background:linear-gradient(135deg,var(--moss),var(--pine));color:var(--cream);border:none;border-radius:3px;padding:10px 26px;font-family:-apple-system,Georgia,serif;font-size:.97rem;cursor:pointer;transition:all .2s;box-shadow:0 3px 10px rgba(0,0,0,.28);}
.big-save:hover{transform:translateY(-1px);}
.entries-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.entries-title{font-family:-apple-system,Georgia,serif;font-size:1.15rem;color:var(--cream);}
.entry-count{background:rgba(200,135,42,.2);border:1px solid rgba(200,135,42,.35);color:var(--amber);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 11px;border-radius:20px;}
.entry-card{background:var(--parchment);border-radius:4px;margin-bottom:10px;overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.27);transition:transform .2s,box-shadow .2s;}
.entry-card:hover{transform:translateY(-2px);box-shadow:0 7px 26px rgba(0,0,0,.38);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:13px 17px 10px;border-bottom:1px solid var(--fog);}
.card-loc{font-family:var(--font-heading);font-size:1.05rem;font-weight:600;color:var(--bark);margin-bottom:2px;letter-spacing:.01em;}
.card-date{font-size:.78rem;color:var(--fog);letter-spacing:.06em;}
.card-badges{display:flex;gap:5px;align-items:center;flex-shrink:0;}
.bw{font-size:1.15rem;}.bm{background:var(--moss);color:var(--cream);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:12px;}
.card-body{padding:11px 17px 13px;}
.card-note{font-size:.95rem;line-height:1.7;color:var(--bark);white-space:pre-wrap;}
.card-hl{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px;}
.hl-tag{background:rgba(200,135,42,.15);border:1px solid rgba(200,135,42,.3);color:var(--soil);font-size:.76rem;padding:2px 8px;border-radius:4px;}
.card-foot{padding:7px 17px;background:rgba(0,0,0,.04);border-top:1px solid var(--fog);display:flex;justify-content:flex-end;}
.btn-sm{background:none;border:1px solid var(--fog);color:var(--fog);font-family:-apple-system,Georgia,serif;font-size:.8rem;padding:3px 11px;border-radius:3px;cursor:pointer;transition:all .2s;}
.btn-sm:hover{border-color:#c0392b;color:#c0392b;}
/* ── RATINGS & FAVORITES ── */
.star-row{display:flex;gap:2px;align-items:center;}
.star{font-size:1.1rem;cursor:pointer;color:var(--fog);transition:color .15s;line-height:1;}
.star.on{color:var(--amber);}
.star:hover,.star:hover~.star{color:var(--fog);}
.star-row:hover .star{color:var(--amber);}
.star-row .star:hover~.star{color:var(--fog);}
.btn-fav{background:none;border:none;font-size:1.15rem;cursor:pointer;padding:0 2px;line-height:1;transition:transform .15s;}
.btn-fav:hover{transform:scale(1.25);}
/* ── FILTER PILLS ── */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filter-pill{background:rgba(245,237,216,.1);border:1px solid rgba(245,237,216,.2);color:var(--fog);border-radius:20px;padding:5px 14px;font-family:-apple-system,Georgia,serif;font-size:.82rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
.filter-pill:hover{border-color:var(--amber);color:var(--cream);}
.filter-pill.active{background:var(--amber);border-color:var(--amber);color:white;font-weight:600;}
/* ── STATS HIGHLIGHT ── */
.stat-sub{font-size:.65rem;color:var(--fog);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.empty-state{text-align:center;padding:44px 20px;color:var(--smoke);}
.empty-state .icon{font-size:2.4rem;margin-bottom:10px;}
.empty-state p{font-size:1rem;font-style:italic;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--pine);color:var(--cream);border:1px solid var(--amber);padding:9px 22px;border-radius:4px;font-size:.88rem;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.year-divider{text-align:center;color:var(--amber);font-family:-apple-system,Georgia,serif;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;margin:4px 0 2px;opacity:.7;}

/* ── iPhone / touch optimizations ── */
@media (max-width: 600px) {
  .app { padding: 12px 10px 80px; }
  .stats-bar { grid-template-columns: repeat(3,1fr); gap: 6px; }
  .stat { padding: 10px 8px; }
  .stat-num { font-size: 1.4rem; }
  .stat-icon { font-size: 1.3rem; margin-bottom: 6px; }
  .tabs { gap: 3px; }
  .tab { padding: 8px 6px; font-size: .8rem; }
  .top-bar { flex-wrap: wrap; gap: 6px; }
  .top-bar input { min-width: 0; }
  .btn-amber { padding: 0 12px; font-size: .82rem; }
  .park-header { padding: 11px 12px; }
  .park-name { font-size: .95rem; }
  .park-body { padding: 0 12px 14px; }
  .info-grid { grid-template-columns: 1fr; }
  .trip-entry { font-size: .82rem; gap: 5px; }
  .add-trip-row { gap: 8px; }
  .add-trip-row input[type="date"] { width: 140px; }
  .modal { padding: 20px 16px; }
  .fg2 { grid-template-columns: 1fr; }
  #editTripBox { padding: 20px 16px; }
  .btn-edit-trip { font-size: 1rem; padding: 2px 6px; }
  .btn-del-trip  { font-size: 1rem; padding: 2px 6px; }
  .btn-add-trip  { padding: 10px 14px; }
  .modal-bg, #editTripBg { padding: 20px 10px; align-items: flex-start; }
}
* { -webkit-tap-highlight-color: transparent; }
html { -webkit-overflow-scrolling: touch; }
/* Edit trip */
.trip-actions{display:flex;gap:3px;margin-left:auto;flex-shrink:0;}
.btn-edit-trip{background:none;border:none;color:var(--fog);cursor:pointer;font-size:.82rem;padding:0 4px;line-height:1;transition:color .2s;}
.btn-edit-trip:hover{color:var(--amber);}
#editTripBg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
#editTripBg.hidden{display:none;}
#editTripBox{background:var(--parchment);border-radius:6px;padding:26px 28px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#lightbox.hidden{display:none;}
#lightbox img{max-width:92vw;max-height:88vh;border-radius:4px;}
.trip-thumb{max-width:110px;max-height:80px;border-radius:3px;border:1px solid var(--fog);cursor:pointer;object-fit:cover;margin-top:4px;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* ── PLANNER TABS ── */
.pl-section{margin-bottom:18px;}
.pl-label{display:block;font-family:var(--font-body);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#6b5740;margin-bottom:5px;}
.pl-input{width:100%;background:rgba(255,255,255,.5);border:1px solid var(--fog);border-radius:3px;padding:8px 11px;font-family:-apple-system,Georgia,serif;font-size:16px;color:var(--bark);outline:none;box-sizing:border-box;transition:border-color .2s;}
.pl-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(200,135,42,.15);}
.pl-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:560px){.pl-row2{grid-template-columns:1fr;}}
.pl-card{background:var(--parchment);border-radius:4px;padding:20px 22px;margin-bottom:12px;box-shadow:0 3px 16px rgba(0,0,0,.27);border-left:5px solid var(--moss);}
.pl-card.amber-l{border-left-color:var(--amber);}
.pl-card.ember-l{border-left-color:var(--ember);}
.pl-card h3{font-family:-apple-system,Georgia,serif;font-size:1rem;color:var(--bark);margin-bottom:12px;}
.pl-btn-main{background:linear-gradient(135deg,var(--moss),var(--pine));color:var(--cream);border:none;border-radius:3px;padding:10px 22px;font-family:-apple-system,Georgia,serif;font-size:.95rem;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.25);width:100%;}
.pl-btn-main:hover{transform:translateY(-1px);}
.pl-btn-main:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.pl-chip{display:inline-block;font-size:.72rem;padding:3px 9px;border-radius:12px;margin:2px;}
.pl-chip.green{background:var(--moss);color:var(--cream);}
.pl-chip.amber{background:var(--amber);color:white;}
.pl-chip.smoke{background:rgba(139,125,107,.2);color:var(--fog);}
.pl-chip.blue{background:#1a5276;color:#d6eaf8;}
.pl-result{background:var(--parchment);border-radius:4px;margin-bottom:10px;box-shadow:0 3px 16px rgba(0,0,0,.27);overflow:hidden;border-left:5px solid var(--moss);}
.pl-result-head{padding:13px 17px 10px;}
.pl-result-name{font-family:-apple-system,Georgia,serif;font-size:1.02rem;color:var(--bark);margin-bottom:3px;}
.pl-result-loc{font-size:.8rem;color:var(--fog);}
.pl-result-body{padding:0 17px 14px;}
.pl-result-desc{font-size:.88rem;color:var(--bark);line-height:1.6;margin:8px 0;}
.pl-result-note{font-size:.82rem;color:var(--soil);background:rgba(200,135,42,.12);border:1px solid rgba(200,135,42,.25);border-radius:3px;padding:6px 10px;margin:8px 0;}
.pl-result-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px solid var(--fog);}
.pl-amenity-wrap{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;}
.am-pill{background:rgba(61,90,42,.15);border:1px solid rgba(61,90,42,.25);color:var(--moss);font-size:.7rem;padding:2px 8px;border-radius:10px;}
.am-pill.selected{background:var(--moss);color:var(--cream);}
.am-toggle{display:inline-flex;align-items:center;gap:5px;font-family:-apple-system,Georgia,serif;font-size:.82rem;padding:5px 12px;border:1px solid var(--fog);border-radius:20px;cursor:pointer;color:var(--fog);background:rgba(255,255,255,.3);transition:all .2s;}
.am-toggle:hover{border-color:var(--amber);color:var(--bark);}
.am-toggle.on{background:var(--amber);border-color:var(--amber);color:white;}
.cl-cat{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);margin:14px 0 6px;font-family:-apple-system,Georgia,serif;}
.cl-item{display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(255,255,255,.3);border:1px solid var(--fog);border-radius:3px;margin-bottom:5px;cursor:pointer;transition:background .15s;}
.cl-item:hover{background:rgba(255,255,255,.5);}
.cl-item.done{opacity:.55;}
.cl-box{width:18px;height:18px;border-radius:3px;border:1px solid var(--fog);background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.cl-box.checked{background:var(--moss);border-color:var(--moss);}
.cl-text{font-size:.9rem;color:var(--bark);flex:1;}
.cl-item.done .cl-text{text-decoration:line-through;color:var(--fog);}
.prog-bar{background:rgba(255,255,255,.2);border-radius:3px;height:7px;overflow:hidden;margin-bottom:4px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--amber));border-radius:3px;transition:width .4s ease;}
.apikey-box{background:rgba(0,0,0,.2);border:1px solid rgba(245,237,216,.15);border-radius:4px;padding:14px 16px;margin-bottom:16px;}
.apikey-box p{font-size:.78rem;color:var(--fog);line-height:1.6;margin-bottom:8px;}
.spinning{animation:spin 1s linear infinite;display:inline-block;}

/* ── 2026 DESIGN REFRESH ── */
:root{
  --bark:#26180f;
  --moss:#486b3a;
  --pine:#142719;
  --soil:#76523a;
  --amber:#d79a35;
  --cream:#fff7e8;
  --parchment:#f3e6c8;
  --fog:#776957;
  --smoke:#cdbfaa;
  --ember:#c75f2b;
}
body{
  background-color:#142719;
  background-image:
    linear-gradient(180deg,rgba(12,25,16,.7),rgba(20,39,25,.92)),
    radial-gradient(circle at 12% 0%,rgba(215,154,53,.18),transparent 34%),
    radial-gradient(circle at 86% 12%,rgba(72,107,58,.28),transparent 35%),
    linear-gradient(135deg,#102116 0%,#20371f 52%,#351f13 100%);
  background-attachment:fixed;
}
.app{max-width:1180px;padding:42px 22px 92px;}
header{
  text-align:left;
  margin:0 0 20px;
  padding:28px 30px;
  border:1px solid rgba(255,247,232,.16);
  border-radius:8px;
  background:linear-gradient(135deg,rgba(255,247,232,.13),rgba(255,247,232,.04));
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(16px);
}
.logo-row{justify-content:flex-start;margin-bottom:8px;}
header h1{letter-spacing:0;text-shadow:0 2px 18px rgba(0,0,0,.28);}
header p{margin-top:8px;color:rgba(255,247,232,.72);}
.divider{margin:16px 0 0;width:180px;}
.welcome-msg{font-size:1rem;color:rgba(255,247,232,.86);}
#userBar{
  padding:8px 10px;
  border:1px solid rgba(255,247,232,.12);
  border-radius:8px;
  background:rgba(10,20,13,.22);
  backdrop-filter:blur(12px);
}
#userBar button{
  min-height:30px;
  border-radius:6px!important;
  color:var(--cream)!important;
}
.stats-bar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin:18px 0 24px;}
.stat{
  min-width:0;
  border-radius:12px;
  padding:22px 16px 20px;
  background:rgba(255,247,232,.12);
  border-color:rgba(255,247,232,.16);
  box-shadow:0 10px 26px rgba(0,0,0,.18);
  backdrop-filter:blur(12px);
}
.stat-icon{font-size:1.8rem;}
.stat-num{font-size:2.4rem;color:#f1b44d;}
.stat-label{color:rgba(255,247,232,.7);}
.stat-sub{color:rgba(255,247,232,.72);}
.tabs{
  position:sticky;
  top:10px;
  z-index:20;
  gap:6px;
  padding:6px;
  border:1px solid rgba(255,247,232,.14);
  border-radius:8px;
  background:rgba(12,25,16,.72);
  backdrop-filter:blur(18px);
  box-shadow:0 14px 36px rgba(0,0,0,.28);
}
.tab{
  border:0;
  border-radius:6px;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,247,232,.68);
  background:transparent;
  font-weight:700;
}
.tab:hover{background:rgba(255,247,232,.1);}
.tab.active{
  background:var(--cream);
  color:var(--pine);
  box-shadow:0 8px 18px rgba(0,0,0,.18);
}
.top-bar{
  gap:10px;
  padding:12px;
  border:1px solid rgba(255,247,232,.13);
  border-radius:8px;
  background:rgba(12,25,16,.42);
  box-shadow:0 12px 28px rgba(0,0,0,.2);
  backdrop-filter:blur(14px);
}
.top-bar input{
  min-height:42px;
  border-radius:6px;
  background:rgba(255,247,232,.12);
  color:var(--cream);
}
.top-bar > button{flex:0 1 auto;max-width:100%;}
.btn-amber,.btn-g,.btn-o,.btn-save,.btn-cancel,.big-save,.btn-add-trip,.pl-btn-main,.btn-sm{
  border-radius:6px;
  min-height:36px;
  font-family:var(--font-body);
  font-weight:700;
}
.btn-amber,.btn-save,.big-save{
  background:linear-gradient(135deg,#e0a443,#c75f2b);
  box-shadow:0 8px 18px rgba(199,95,43,.26);
}
.filter-bar{gap:8px;margin:14px 0;}
.filter-pill{
  border-radius:999px;
  color:rgba(255,247,232,.76);
  background:rgba(255,247,232,.1);
}
#timelineYears .filter-pill{
  color:#3a2f1e;
  background:rgba(58,47,30,.12);
  border:1px solid rgba(58,47,30,.25);
  font-weight:600;
}
#timelineYears .filter-pill:hover{
  background:rgba(58,47,30,.22);
  border-color:#3a2f1e;
}
.park-card,.entry-card,.pl-card,.pl-result,.entry-form{
  border-radius:8px;
  box-shadow:0 12px 34px rgba(0,0,0,.25);
}
.park-card,.entry-card,.pl-card,.pl-result{
  background:linear-gradient(180deg,#fbefd4,#ead8b5);
}
.park-header{padding:16px 18px;border-left-width:6px;}
.park-name,.card-loc,.pl-result-name{font-size:1.12rem;letter-spacing:0;}
.park-sub{color:#756654;}
.badge,.trip-count-badge,.bm,.hl-tag,.pl-chip,.am-pill{
  border-radius:999px;
  font-weight:700;
}
.park-body{border-top-color:rgba(38,24,15,.16);}
.info-grid{gap:12px;}
.info-block{
  padding:12px;
  border:1px solid rgba(38,24,15,.12);
  border-radius:8px;
  background:rgba(255,255,255,.26);
}
.trip-entry,.cl-item{
  border-color:rgba(38,24,15,.13);
  border-radius:6px;
  background:rgba(255,255,255,.36);
}
.add-trip-row{
  border-radius:8px;
  border-color:rgba(38,24,15,.22);
  background:rgba(255,255,255,.24);
}
input[type="text"],input[type="date"],textarea,select,.pl-input,.add-trip-row input{
  border-radius:6px;
  background:rgba(255,255,255,.62);
  font-family:var(--font-body);
}
.modal,#editTripBox{
  border-radius:8px;
  background:linear-gradient(180deg,#fbefd4,#ead8b5);
  box-shadow:0 28px 80px rgba(0,0,0,.62);
}
.modal-bg,#editTripBg{backdrop-filter:blur(10px);}.modal-bg#detailModalBg{z-index:120}.modal-bg#mapModalBg{z-index:100}
.toast{border-radius:999px;}
.timeline-hero{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:14px;
  margin-bottom:18px;
}
.timeline-summary,.timeline-year,.timeline-card{
  background:linear-gradient(180deg,#fbefd4,#ead8b5);
  border:1px solid rgba(38,24,15,.12);
  border-radius:8px;
  box-shadow:0 12px 34px rgba(0,0,0,.24);
}
.timeline-summary{padding:20px 22px;}
.timeline-summary h2{
  font-family:var(--font-heading);
  font-size:1.45rem;
  color:var(--bark);
  margin-bottom:5px;
}
.timeline-summary p{color:var(--soil);font-size:.92rem;line-height:1.55;}
.timeline-metrics{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-top:14px;
}
.timeline-metric{
  border:1px solid rgba(38,24,15,.12);
  border-radius:8px;
  padding:10px;
  background:rgba(255,255,255,.28);
}
.timeline-metric strong{
  display:block;
  font-family:var(--font-heading);
  font-size:1.25rem;
  color:var(--amber);
  line-height:1;
}
.timeline-metric span{
  display:block;
  margin-top:5px;
  font-size:.62rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--fog);
}
.timeline-year{
  padding:14px 16px;
  margin:18px 0 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.timeline-year h3{
  font-family:var(--font-heading);
  font-size:1.25rem;
  color:var(--bark);
}
.timeline-year span{
  color:var(--soil);
  font-weight:700;
  font-size:.82rem;
}
.timeline-list{
  position:relative;
  padding-left:28px;
}
.timeline-list::before{
  content:'';
  position:absolute;
  left:11px;
  top:0;
  bottom:0;
  width:2px;
  background:linear-gradient(180deg,var(--amber),rgba(72,107,58,.35));
}
.timeline-card{
  position:relative;
  padding:14px 16px;
  margin-bottom:10px;
}
.timeline-card::before{
  content:'';
  position:absolute;
  left:-33px;
  top:19px;
  width:13px;
  height:13px;
  border-radius:50%;
  background:var(--amber);
  border:3px solid var(--cream);
  box-shadow:0 0 0 2px rgba(38,24,15,.22);
}
.timeline-card-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}
.timeline-park{
  font-family:var(--font-heading);
  font-size:1.05rem;
  color:var(--bark);
  font-weight:700;
}
.timeline-park-btn{
  appearance:none;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  font:inherit;
  color:var(--bark);
  font-weight:700;
  text-align:left;
  cursor:pointer;
  text-decoration:underline;
  text-decoration-color:rgba(200,113,26,.45);
  text-underline-offset:3px;
}
.timeline-park-btn:hover{color:var(--moss);}
.timeline-trip-details{
  margin-top:11px;
  padding-top:11px;
  border-top:1px solid rgba(38,24,15,.10);
}
.timeline-trip-details .reservation-box{margin-top:0;}
.timeline-trip-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.timeline-date{
  color:var(--soil);
  font-size:.82rem;
  margin-top:2px;
}
.timeline-num{
  background:var(--amber);
  color:white;
  border-radius:999px;
  padding:3px 10px;
  font-weight:700;
  font-size:.78rem;
  white-space:nowrap;
}
.timeline-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.timeline-pill{
  border-radius:999px;
  background:rgba(72,107,58,.14);
  border:1px solid rgba(72,107,58,.22);
  color:var(--moss);
  font-size:.74rem;
  font-weight:700;
  padding:3px 9px;
}
.timeline-note{
  margin-top:10px;
  color:var(--soil);
  font-style:italic;
  font-size:.88rem;
  line-height:1.55;
}
@media(max-width:980px){
  .stats-bar{grid-template-columns:repeat(3,minmax(0,1fr));}
  .tabs{overflow-x:auto;justify-content:flex-start;}
  .tab{flex:0 0 auto;min-width:148px;padding:10px 12px;}
  .top-bar{flex-wrap:wrap;}
  .top-bar input{flex-basis:100%;}
  .timeline-hero{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .app{padding:12px 10px 84px;}
  header{padding:20px 18px;}
  .logo-row{gap:9px;}
  .stats-bar{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .stat{padding:12px 8px;}
  .tabs{top:6px;}
  .tab{min-width:132px;min-height:40px;}
  .park-header{align-items:flex-start;}
  .park-header>div:first-child{min-width:0;}
  .park-right{flex-wrap:wrap;justify-content:flex-end;max-width:45%;}
  .trip-entry{flex-wrap:wrap;}
  .trip-note{flex-basis:100%;}
  .timeline-metrics{grid-template-columns:1fr;}
  .timeline-list{padding-left:20px;}
  .timeline-card::before{left:-25px;}
  .timeline-card-head{flex-direction:column;}
}
@media print{
  body{background:#fff!important;color:#111!important;}
  .tabs,.top-bar,#userBar,.btn-amber,.btn-g,.btn-o,.btn-save,.btn-cancel,.big-save,.btn-add-trip,.modal-bg,#editTripBg,#toast{display:none!important;}
  .app{max-width:none;padding:0!important;}
  header,.stat,.park-card,.entry-card,.pl-card,.pl-result,.entry-form,.timeline-summary,.timeline-year,.timeline-card{box-shadow:none!important;break-inside:avoid;}
  .panel{display:block!important;}
  .panel:not(.active){display:none!important;}
}

.state-group{margin-bottom:4px;}
.state-group-header{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;margin-top:14px;border-bottom:2px solid var(--moss);cursor:pointer;user-select:none;}
.state-group-header h3{font-family:Georgia,serif;font-size:1rem;font-weight:700;color:var(--moss);margin:0;flex:1;letter-spacing:.04em;}
.state-group-header .sg-meta{font-size:.78rem;color:var(--smoke);}
.state-group-header .sg-chev{color:var(--moss);transition:transform .2s;font-size:.85rem;}
.state-group-header.sg-collapsed .sg-chev{transform:rotate(-90deg);}
.sg-body.sg-collapsed{display:none;}
/* Form fields stay at 16px on touch screens so iPhones don't zoom in when one is tapped.
   That is what lets the page allow normal pinch-zoom. */
@media (pointer:coarse){ input, select, textarea { font-size:16px !important; } }
/* The account bar wraps onto a second row on narrow screens instead of pushing buttons off-screen. */
#userBar{ flex-wrap:wrap; row-gap:6px; }
#userBar button{ white-space:nowrap; }
#userEmail{ overflow-wrap:anywhere; }
.trip-fee{ font-size:.72rem; color:var(--moss); font-weight:600; white-space:nowrap; }

/* ══ TRAIL NOTES 2.0 ENHANCEMENTS ══ */
.dashboard-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-bottom:18px}.dash-card{background:var(--parchment);border-radius:9px;padding:18px;box-shadow:0 3px 14px rgba(0,0,0,.18)}
.dash-card h2,.dash-card h3{font-family:var(--font-heading);color:var(--bark);margin:0 0 10px}.dash-card h2{font-size:1.35rem}.dash-card h3{font-size:1rem}.dash-muted{color:var(--fog);font-size:.84rem}.dash-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.dash-action{border:0;border-radius:6px;padding:9px 12px;background:var(--moss);color:var(--cream);cursor:pointer;font-family:var(--font-body);font-weight:700}.dash-action.alt{background:rgba(107,66,38,.12);color:var(--bark);border:1px solid rgba(107,66,38,.22)}
